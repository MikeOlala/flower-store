<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tài khoản liên kết</title>

    <!-- MDB (nếu bạn không dùng MDB, bỏ dòng này) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/linkAccount.css">
    <!-- Bootstrap icons (dùng cho icon ngân hàng) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<!-- Header -->
<header class="header d-flex align-items-center px-3 py-2">
    <a href="settingProfile.html" class="text-white fs-4 me-3 back-btn" title="Quay lại">
        <i class="bi bi-arrow-left"></i>
    </a>
    <!--    <h5 class="m-0 text-white">Tài khoản liên kết</h5>-->
</header>

<!-- Main content -->
<div class="link-wrapper">
    <aside class="sidebar">
        <a href="settingProfile.html" class="back-btn"><i class="bi bi-arrow-left"></i> Quay lại cài đặt</a>
        <div class="user-card">
            <img src="img\avatar_1.jpg"class="avatar" alt="avatar">
            <h4>Customer</h4>
            <p>Thành viên từ 10/2025</p>
            <div class="points">🌸 290 POINTS</div>
        </div>
    </aside>

    <!-- Main content -->
    <main class="container py-4">
        <!-- Danh sách tài khoản -->
        <div id="accountList" class="account-list"></div>

        <!-- Chi tiết tài khoản (thêm mới) -->
        <div id="accountDetail" class="account-detail hidden">
            <div class="detail-card">
                <img id="detailIcon" class="detail-icon" src="" alt="icon">
                <h4 id="detailName"></h4>
                <p id="detailStatus" class="detail-status"></p>
                <p id="detailDesc" class="detail-desc"></p>
                <button class="btn-close-detail" onclick="closeDetail()">Đóng</button>
            </div>
        </div>
    </main>

</div>

<!-- Modal -->
<div id="linkModal" class="custom-modal" aria-hidden="true">
    <div class="modal-content animate-scale">
        <h5 id="linkTitle" class="fw-bold text-center mb-2">Liên kết tài khoản</h5>
        <p id="linkMessage" class="text-center mb-4 text-secondary"></p>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Hủy</button>
            <button id="confirmBtn" class="btn-save">Xác nhận</button>
        </div>
    </div>
</div>

<!-- Scripts: đặt JS cuối body để DOM đã sẵn sàng -->
<script src="../../MDB5-STANDARD-UI-KIT-Free-9.2.0 (1)/js/mdb.umd.min.js"></script>
<script src="fileJS/linkAccount.js"></script>
</body>
</html>
