    <main class="content">
        <h3>Địa chỉ giao hàng</h3>

        <form id="addressForm" class="address-form">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label text-brown">Họ và tên</label>
                    <input type="text" class="form-control input-beige" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-brown">Số điện thoại</label>

                </div>
            </div>

            <div class="mb-3">

            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label text-brown">Thành phố / Tỉnh</label>
                    <input type="text" class="form-control input-beige" placeholder="TP. Hồ Chí Minh" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-brown">Quận / Huyện</label>
                    <input type="text" class="form-control input-beige" placeholder="Quận 1" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-brown">Ghi chú</label>
                <textarea class="form-control input-beige" rows="3" placeholder="Ví dụ: Giao giờ hành chính"></textarea>
            </div>

            <div class="text-end">
                <button type="submit" class="btn btn-brown">Lưu địa chỉ</button>
            </div>
        </form>

        <!-- Danh sách địa chỉ đã lưu -->
        <div id="savedAddresses" class="mt-4">
